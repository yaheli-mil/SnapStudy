plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.services)
}

android {
    namespace 'com.yalig.snapstudy'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.yalig.snapstudy"
        minSdk 34
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // Firebase BoM and Services
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore

    // Google Credential Manager for Modern Sign-In
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.googleid

    // Image loading
    implementation libs.glide

    // RecyclerView for the list of study sets
    implementation libs.recyclerview

    // ML Kit Text Recognition (finds the text area in the photo)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}