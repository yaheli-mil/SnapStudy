<script>
  (() => {
    let laserDirection = 1;
    let laserPos = 10;
    const laser = document.getElementById('laser-line');
    
    function animateScan() {
      if (!laser) return;
      laserPos += 0.5 * laserDirection;
      if (laserPos >= 90) {
        laserDirection = -1;
      } else if (laserPos <= 10) {
        laserDirection = 1;
      }
      laser.style.top = laserPos + '%';
      requestAnimationFrame(animateScan);
    }
    requestAnimationFrame(animateScan);

    let flashIndex = 0;
    const flashModes = [
      { icon: 'flash_auto', label: 'אוטו' },
      { icon: 'flash_on', label: 'פעיל' },
      { icon: 'flash_off', label: 'כבוי' }
    ];

    window.cycleFlash = () => {
      flashIndex = (flashIndex + 1) % flashModes.length;
      const flash = flashModes[flashIndex];
      const iconEl = document.getElementById('flash-icon');
      const textEl = document.getElementById('flash-text');
      if (iconEl && textEl) {
        iconEl.textContent = flash.icon;
        textEl.textContent = flash.label;
      }
    };

    window.toggleGrid = () => {
      const grid = document.getElementById('grid-overlay');
      const btn = document.getElementById('grid-toggle-btn');
      if (!grid || !btn) return;
      const isVisible = grid.classList.contains('opacity-100');
      if (isVisible) {
        grid.classList.remove('opacity-100');
        grid.classList.add('opacity-0');
        btn.classList.remove('bg-primary', 'text-on-primary');
        btn.classList.add('bg-inverse-surface/40', 'text-surface');
      } else {
        grid.classList.remove('opacity-0');
        grid.classList.add('opacity-100');
        btn.classList.add('bg-primary', 'text-on-primary');
        btn.classList.remove('bg-inverse-surface/40', 'text-surface');
      }
    };

    window.toggleCaptureMode = (isAuto) => {
      const btnAuto = document.getElementById('btn-auto-capture');
      const btnManual = document.getElementById('btn-manual-capture');
      if (!btnAuto || !btnManual) return;
      if (isAuto) {
        btnAuto.className = 'px-3.5 py-1.5 rounded-full text-label-sm font-label-sm bg-primary text-on-primary shadow-sm transition-all';
        btnManual.className = 'px-3.5 py-1.5 rounded-full text-label-sm font-label-sm text-surface/80 hover:text-surface transition-all';
      } else {
        btnManual.className = 'px-3.5 py-1.5 rounded-full text-label-sm font-label-sm bg-primary text-on-primary shadow-sm transition-all';
        btnAuto.className = 'px-3.5 py-1.5 rounded-full text-label-sm font-label-sm text-surface/80 hover:text-surface transition-all';
      }
    };

    window.setMode = (button, modeName) => {
      document.querySelectorAll('.mode-chip').forEach(chip => {
        chip.className = 'mode-chip px-4 py-1.5 rounded-full bg-surface-variant/20 text-surface/80 text-label-md font-label-md hover:text-surface active:scale-95 transition-all';
      });
      button.className = 'mode-chip px-4 py-1.5 rounded-full bg-primary text-on-primary text-label-md font-label-md font-semibold tracking-wide shadow-md active:scale-95 transition-all';
    };

    window.triggerCapture = () => {
      const flash = document.getElementById('capture-flash');
      const bg = document.getElementById('viewfinder-bg');
      if (flash) {
        flash.classList.remove('opacity-0');
        flash.classList.add('opacity-90');
        setTimeout(() => {
          flash.classList.remove('opacity-90');
          flash.classList.add('opacity-0');
        }, 120);
      }
      if (bg) {
        bg.classList.add('scale-105');
        setTimeout(() => bg.classList.remove('scale-105'), 260);
      }
    };

    window.triggerGalleryPick = () => {
      const btn = document.getElementById('shutter-button');
      if (btn) {
        btn.classList.add('scale-95');
        setTimeout(() => btn.classList.remove('scale-95'), 150);
      }
    };
  })();
</script></main>
