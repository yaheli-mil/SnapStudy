neHeight": "26px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface text-on-surface flex flex-col min-h-screen antialiased selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex flex-col relative w-full pb-safe bg-surface flex-1"><div class="flex flex-col w-full px-margin-mobile pb-space-2xl items-center justify-center select-none">
<!-- Subtle Ambient Glow -->
<div class="absolute top-16 left-1/2 -translate-x-1/2 w-72 h-72 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Header & Brand Presentation -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-xl w-full max-w-sm">
<!-- Brand Logo Mark with soft card framing -->
<div class="relative flex items-center justify-center w-24 h-24 rounded-2xl bg-surface-container-lowest shadow-sm mb-space-base p-space-xs transition-transform duration-300 hover:scale-105">
<img alt="SnapStudy Logo" class="w-full h-full object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1XV5YxyxwXZux1N70K8KFR3NFktlBh49vmUPFBqhaX2Xzt6Z4MfAHVpT1jNiEYT4OqYVXpHQ6SaMM66seC8mPHlDKDwTlPXROPRWgtPrtSuJRsVCuW9Jzc1dtVb4Eu1THn2_RRIfoIh2Ls1EiiiKX4CYXxIVkby9WARJwKKagyEk4H0XHoCvbwYLiNDosL74Y0fLRA_iV6rh443qn22DwDMCHix5QzGC2nVxGucUlUzeOiK4QgeixynCFHA">

</div>
<!-- App Identity -->
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">SnapStudy</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs max-w-[260px]">
      ברוך שובך! אנא התחבר כדי להמשיך.
    </p>
</div>
<!-- Main Interaction Card / Form Hub -->
<div class="w-full max-w-sm bg-surface-container-lowest rounded-2xl p-space-xl shadow-sm flex flex-col gap-space-lg">
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault(); triggerSuccessFeedback();">
<!-- Email Input Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant font-semibold flex items-center justify-between" for="student-email">
<span class="">כתובת אימייל</span>
<span class="font-label-sm text-label-sm text-secondary hidden" id="domain-hint">מוסדי</span>
</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute right-3.5 text-[20px] text-outline transition-colors group-focus-within:text-primary pointer-events-none">
            mail
          </span>
<input class="w-full h-12 pr-11 pl-4 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline/60 rounded-lg outline-none transition-all duration-200 focus:bg-surface-container-low text-right" dir="ltr" id="student-email" onblur="this.style.boxShadow='inset 0 0 0 1px #E2E8F0'" onfocus="this.style.boxShadow='inset 0 0 0 2px #1D4ED8, 0 0 0 4px rgba(29, 78, 216, 0.12)'" placeholder="name@example.com" required="" style="box-shadow: rgb(226, 232, 240) 0px 0px 0px 1px inset;" type="email">
</div>
</div>
<!-- Password Input Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-semibold" for="student-password">
            סיסמה
          </label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors py-0.5" href="#">
            שכחת סיסמה?
          </a>
</div>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute right-3.5 text-[20px] text-outline transition-colors group-focus-within:text-primary pointer-events-none">
            lock
          </span>
<input class="w-full h-12 pr-11 pl-11 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline/60 rounded-lg outline-none transition-all duration-200 focus:bg-surface-container-low text-right" dir="ltr" id="student-password" onblur="this.style.boxShadow='inset 0 0 0 1px #E2E8F0'" onfocus="this.style.boxShadow='inset 0 0 0 2px #1D4ED8, 0 0 0 4px rgba(29, 78, 216, 0.12)'" placeholder="••••••••" required="" style="box-shadow: inset 0 0 0 1px #E2E8F0;" type="password">
<button aria-label="הצג/הסתר סיסמה" class="absolute left-3.5 text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1 rounded-md" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Keep me logged in checkbox -->
<div class="flex items-center justify-between mt-space-xxs">
<label class="flex items-center gap-2.5 cursor-pointer">
<input checked="" class="w-4 h-4 rounded text-primary focus:ring-primary accent-primary cursor-pointer" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant">זכור מכשיר זה</span>
</label>

</div>
<!-- Action Button -->
<button class="w-full h-12 mt-space-xs bg-primary text-on-primary font-label-lg text-label-lg font-bold rounded-lg shadow-sm active:bg-primary-container active:scale-[0.99] transition-all flex items-center justify-center gap-2 group cursor-pointer" id="login-btn" type="submit">
<span id="btn-text" class="">התחברות</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-200 group-hover:-translate-x-1" id="btn-icon">arrow_back</span>
</button>
</form>
<!-- Visual Separation -->
<div class="relative flex items-center justify-center my-space-xs">
<div class="w-full h-[1px] bg-surface-variant"></div>
<span class="absolute bg-surface-container-lowest px-3 font-label-sm text-label-sm text-outline tracking-normal">
        או המשך באמצעות
      </span>
</div>
<!-- Social Authentication Grid -->
<div class="grid grid-cols-2 gap-3">
<!-- Google Sign In -->
<button class="h-12 flex items-center justify-center gap-2.5 rounded-lg bg-surface-container-low hover:bg-surface-container active:scale-[0.98] transition-all duration-150 px-3 cursor-pointer" style="box-shadow: rgb(226, 232, 240) 0px 0px 0px 1px inset;" type="button">
<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface font-semibold">Google</span>
</button>
<!-- Apple Sign In -->
<button class="h-12 flex items-center justify-center gap-2 rounded-lg bg-surface-container-low hover:bg-surface-container active:scale-[0.98] transition-all duration-150 px-3 cursor-pointer" style="box-shadow: rgb(226, 232, 240) 0px 0px 0px 1px inset;" type="button">
<svg class="w-4 h-4 fill-current text-on-surface shrink-0" viewBox="0 0 170 170">
<path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.67-7.81-11.96-14.34-5.77-8.91-10.37-18.77-13.79-29.58-3.42-10.81-5.13-21.39-5.13-31.75 0-14.12 3.58-25.75 10.74-34.89 7.16-9.14 16.2-13.84 27.12-14.1 4.58 0 9.8 1.25 15.66 3.75 5.86 2.5 9.74 3.79 11.64 3.87 1.52 0 5.62-1.36 12.31-4.08 6.69-2.72 12.35-3.92 16.98-3.62 12.83.65 22.84 5.37 30.03 14.17-11.41 6.85-17.01 16.31-16.8 28.38.22 9.57 3.86 17.51 10.93 23.82 7.07 6.31 15.54 9.9 25.43 10.77-2.18 6.74-4.89 13.6-8.15 20.57zM119.22 31.84c0-7.72 2.76-14.94 8.28-21.66 5.52-6.72 12.32-10.18 20.4-10.18.22 1.09.33 2.18.33 3.26 0 7.61-2.83 14.88-8.48 21.82-5.65 6.94-12.57 10.7-20.76 11.27.11-1.52.23-3.03.23-4.51z"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface font-semibold">Apple</span>
</button>
</div>
</div>
<!-- Sign Up Footer Prompt -->
<div class="mt-space-lg text-center flex items-center justify-center gap-1.5">
<span class="font-body-md text-body-md text-on-surface-variant">אין לך חשבון?</span>
<a class="font-label-lg text-label-lg font-bold text-primary hover:underline hover:text-primary-container transition-all" href="#">
      הרשם עכשיו
    </a>
</div>
<!-- Micro Study Affirmation / Daily Insight -->

</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('student-password');
    const icon = document.getElementById('pwd-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function triggerSuccessFeedback() {
    const btn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    
    btn.classList.add('bg-tertiary-container');
    btnText.textContent = 'מתחבר...';
    btnIcon.textContent = 'sync';
    btnIcon.classList.add('animate-spin');

    setTimeout(() => {
      btn.classList.remove('bg-tertiary-container');
      btn.classList.add('bg-primary');
      btnText.textContent = 'הצלחה!';
      btnIcon.classList.remove('animate-spin');
      btnIcon.textContent = 'check';
    }, 1200);
  }
</script></main>













</body></html>
